datadir: /home/erigon/.local/share/erigon
chain: mainnet
prune.mode: archive

# HTTP RPC
http: true
http.addr: "10.10.0.5"
http.port: 8545
http.api: eth,net,web3,erigon,debug,trace,ots,txpool,internal
ws: true

# Engine API (consensus layer)
authrpc.addr: "10.10.0.5"
authrpc.port: 8551
authrpc.jwtsecret: /secrets/jwt.hex

# P2P
port: 30303

# RPC query limits — private node, sole consumers are BBB workers.
# Default 1000 rejected the token-scorer's 50k-block eth_getLogs chunks
# (ETH_TOKEN_SCORE_CHUNK) — every holder-snapshot replay failed silently.
rpc.blockrange.limit: 100000
